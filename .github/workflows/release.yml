name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the toolchain. A pin here
          # only worked because older setup-go releases downloaded the toolchain
          # go.mod asked for anyway; that fallback is gone, and a stale pin
          # would break every release build rather than one CI job.
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build release artifacts
        run: VERSION="${GITHUB_REF_NAME#v}" sh scripts/release.sh
      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/prumo-*
            dist/checksums.txt
            dist/release.json
